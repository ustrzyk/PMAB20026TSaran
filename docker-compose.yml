services:
  api:
    build:
      context: .
      dockerfile: SolutionOrders.API/Dockerfile
    container_name: solutionorders-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=PMAB20026TSaran;User=sa;Password=YourStrong@Password123;TrustServerCertificate=True
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - solutionorders-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: solutionorders-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Password123
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - solutionorders-data:/var/opt/mssql
    networks:
      - solutionorders-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong@Password123 -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

networks:
  solutionorders-network:
    driver: bridge

volumes:
  solutionorders-data: